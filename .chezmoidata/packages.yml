# declarative package list for linux hosts. macos is handled by homebrew and ~/.config/homebrew/Brewfile

packages:
  # arch packages, including aur packages
  arch:
    - aur:
      - name: idk
    - standard:
      - name: age
      - name: bat
      - name: btop
      - name: curl
      - name: direnv
      - name: fd-find
      - name: fzf
      - name: git
      - name: git-delta
      - name: git-lfs
      - name: jq
      - name: neovim
      - name: ripgrep
      - name: shellcheck
      - name: starship
      - name: tree
      - name: zsh
  # debian packages
  debian:
    - name: age
    - name: bat
    - name: btop
    - name: curl
    - name: direnv
    - name: fd-find
    - name: fzf
    - name: git
    - name: git-delta
    - name: git-lfs
    - name: jq
    - name: neovim
    - name: ripgrep
    - name: shellcheck
    - name: starship
    - name: tree
    - name: zsh
